name: docs

# Every documentation version is a separate Hugo build, published under
# https://go-numerics.github.io/docs/<version>/ on the gh-pages branch, where
# <version> is the newest minor version among the libraries the pages describe
# (params.libraries in hugo.yaml: v0.1.2 -> 0.1), or "main" while none of
# them is tagged. main is that version's source: each push to main replaces /docs/<version>/, and
# /docs/latest/ follows the newest. Pull requests build and check, and publish
# nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source. Write access to the repository
# is granted to the deploy job alone, below, so a pull request build cannot
# push to gh-pages.
permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  # sha256 of hugo_${HUGO_VERSION}_linux-amd64.tar.gz, from the release's checksums.txt.
  HUGO_SHA256: "4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169"
  DOCS_URL: "https://go-numerics.github.io/docs"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # themes/hextra (the tannevaled/hextra fork, pinned to a release tag)
          # and branding (go-numerics/brand) are submodules.
          submodules: recursive
          # The whole history: each page's creation and modification come from git.
          fetch-depth: 0

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      # The version label is the newest minor version among the libraries
      # params.libraries in hugo.yaml names ("main" until one is released), and
      # it is the last segment of baseURL: the version selector reads it there.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          libs=$(hugo config --format json | jq -r '.params.libraries | to_entries[] | "\(.key) \(.value)"')
          test -n "${libs}" || { echo "::error::params.libraries in hugo.yaml is empty"; exit 1; }
          minors=""
          while read -r name tag; do
            if [ "${tag}" = main ]; then continue; fi
            minor=$(printf '%s\n' "${tag}" | sed -nE 's/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/\1.\2/p')
            if [ -z "${minor}" ]; then
              echo "::error::params.libraries.${name} in hugo.yaml is \"${tag}\", not vMAJOR.MINOR.PATCH or main"
              exit 1
            fi
            minors=$(printf '%s\n%s\n' "${minors}" "${minor}")
          done <<< "${libs}"
          version=$(printf '%s\n' "${minors}" | sed '/^$/d' | sort -t. -k1,1nr -k2,2nr | sed -n 1p)
          version=${version:-main}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "libraries: $(echo ${libs}); documentation version ${version}"

      # Each page's creation (first commit, followed across renames) and its
      # author, for the page history at its foot (params.page.history).
      - name: Page history
        run: |
          mkdir -p data
          sh themes/hextra/scripts/page-history.sh > data/pagehistory.json

      # --panicOnWarning: a deprecated setting or a template warning fails the
      # build rather than scrolling by. A broken {{< relref >}} is an error.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: >-
          hugo --gc --minify --panicOnWarning --printPathWarnings
          --baseURL "${DOCS_URL}/${{ steps.version.outputs.version }}/"

      # Internal links and anchors, offline, with the site laid out under
      # /docs/<version>/ as it is served.
      - name: Lay out the site for the link check
        run: |
          mkdir -p _check/docs
          cp -R public "_check/docs/${{ steps.version.outputs.version }}"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/_check
            '_check/docs/**/*.html'
          fail: true

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  # Every figure on the site is computed by a go-numerics library and drawn
  # by go-plot from the code the page shows (figures/<name>.go, read by the
  # plotfig shortcode). This job draws them again and fails if any image
  # differs from the committed one, so a figure cannot outlive the code or the
  # library versions that drew it. It also fails if figures/go.mod requires
  # another version of a library than the release the pages say they describe
  # (params.libraries in hugo.yaml).
  #
  # It runs on arm64, not amd64, and that is deliberate. Go fuses a*b+c into
  # one rounding on arm64 (and riscv64, loong64, ppc64le, s390x) but not on
  # amd64, so the libraries' last digits depend on the architecture: Quad's
  # error estimate for log(x)/sqrt(x) is 2.34e-13 on arm64 and 1.35e-13 on
  # amd64, and Radau takes 285 steps for van der Pol there against 286. The
  # figures print those numbers in their titles, so they are drawn where the
  # libraries' READMEs measured them (arm64, which is also where a Mac redraws
  # them), and compared on the same architecture.
  figures:
    name: every figure is what its code draws
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: figures/go.mod
          cache-dependency-path: figures/go.sum
      - name: figures/go.mod requires the documented releases
        run: |
          set -euo pipefail
          fail=0
          # The entries of params.libraries, and nothing else of hugo.yaml.
          entries=$(awk '/^  libraries:/ {f=1; next} f && /^    [a-z]+: "/ {print; next} f {exit}' hugo.yaml \
            | sed -E 's/^    ([a-z]+): "([^"]+)"$/\1 \2/')
          test -n "${entries}" || { echo "::error::no params.libraries in hugo.yaml"; exit 1; }
          while read -r name documented; do
            required=$(cd figures && go list -m -f '{{.Version}}' "github.com/go-numerics/${name}")
            echo "hugo.yaml documents ${name} ${documented}; figures/go.mod requires ${required}"
            if [ "${documented}" != main ] && [ "${documented}" != "${required}" ]; then
              echo "::error::the pages describe ${name} ${documented}, the figures are drawn by ${required}"
              fail=1
            fi
          done <<< "${entries}"
          exit $fail
      - name: Draw every figure
        working-directory: figures
        run: go run .
      - name: The committed images are the ones drawn
        run: |
          git add -N static/images/figures
          if ! git diff --exit-code --stat -- static/images/figures; then
            echo "::error::a figure differs from what its code draws: run 'cd figures && go run .' and commit the images"
            exit 1
          fi

  # The offline check above proves the site's own links and anchors. An
  # https:// URL is text to it: this job fetches each one the pages name.
  links:
    name: every external link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: |
          set -uo pipefail
          # The character class matters: an extractor stopping only at ) and "
          # carries a closing > or < into the request.
          urls=$(grep -rhoE 'https?://[^)">< [:space:]]+' content/ README.md | sed -E 's/[.,`]+$//' | sort -u)
          test -n "$urls" || { echo "::error::no links found; are the pages still there?"; exit 1; }
          echo "checking $(printf '%s\n' "$urls" | wc -l) distinct URLs"
          fail=0
          while read -r u; do
            case "$u" in
              # Renders whatever it is asked for; proves nothing.
              *img.shields.io*) continue ;;
              # Documented placeholders, not hosts.
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*.invalid*) continue ;;
              # This site's own pages: they exist only once this workflow
              # has deployed them, and the offline check above already
              # proves every link inside the site.
              *go-numerics.github.io/docs*) continue ;;
              # This repository's own files (figures/): on a pull request
              # that adds them, they are not on main yet.
              *github.com/go-numerics/docs/*) continue ;;
            esac
            # github.com answers curl's blob pages with 503 most of the time,
            # while the raw host answers 200 for a file and 404 for a missing
            # one. A blob link claims "this file exists at this ref", so ask
            # the raw host (as the landing's links.yml and go-ndarray/docs#30).
            probe=$u
            case "$u" in
              https://github.com/*/*/blob/*)
                probe=https://raw.githubusercontent.com/$(printf '%s' "${u#https://github.com/}" | sed -E 's#^([^/]+/[^/]+)/blob/#\1/#; s/[?#].*$//') ;;
            esac
            # Three attempts: one is a flake detector rather than a link
            # checker, and a lane that fails at random gets ignored.
            code=000
            for _ in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 "$probe" 2>/dev/null) || true
              code=${code:-000}
              case "$code" in 2*|3*) break ;; esac
              sleep 3
            done
            case "$code" in
              2*|3*) printf '  ok   %s  %s\n' "$code" "$u" ;;
              *)     printf '  FAIL %s  %s\n' "$code" "$u"; fail=1 ;;
            esac
          done <<< "$urls"
          test "$fail" -eq 0 || { echo "::error::at least one link does not resolve"; exit 1; }

  deploy:
    # Only main publishes. A pull request stops after build above: it has no
    # business pushing to gh-pages.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Never two deploys at once: both would push gh-pages and the second would
    # be rejected. cancel-in-progress stays false -- killing a publish half way
    # through is worse than making it wait.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publishing script, from the commit being published.
      - uses: actions/checkout@v7
        with:
          path: source

      # The published site. Only the version being built is replaced; every
      # other version stays as it is. The first deploy finds no gh-pages
      # branch and starts it empty (orphan): nothing else ever creates it.
      - uses: actions/checkout@v7
        with:
          path: gh-pages
          fetch-depth: 0

      - name: Switch to gh-pages
        working-directory: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
          else
            echo "no gh-pages branch yet: starting one"
            git checkout -q --orphan gh-pages
            git rm -rqf .
            git clean -fdxq
          fi

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Publish ${{ needs.build.outputs.version }}
        run: source/scripts/publish-version.sh "${{ needs.build.outputs.version }}" site gh-pages

      - name: Push gh-pages
        working-directory: gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "Deployed ${GITHUB_SHA::7} to ${{ needs.build.outputs.version }} with Hugo ${HUGO_VERSION}"
          git push origin HEAD:gh-pages
